<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#050403">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mini Live">
  <title>Mini Live</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app" data-session="boot" data-voice="listening" data-muted="false">
    <header class="topbar"></header>

    <section id="settings-drawer" class="settings-drawer" aria-label="Conversation options" hidden>
      <div class="drawer-controls">
        <div class="view-toggle">
          <button id="view-cycle" type="button" aria-label="Conversation display: Orb. Tap for Flow.">
            <span id="view-cycle-icon" class="view-icon view-icon-orb" aria-hidden="true"></span>
            <span id="view-cycle-label" class="drawer-control-label">Orb</span>
            <span id="view-cycle-next" class="view-cycle-next">Tap for Flow</span>
          </button>
        </div>
        <label class="top-toggle" for="barge-in"><input id="barge-in" type="checkbox" switch aria-label="Barge in"><span id="barge-state" class="drawer-control-label">Stable</span></label>
        <label class="top-toggle" for="sound-cues"><input id="sound-cues" type="checkbox" switch aria-label="Sound"><span id="sound-state" class="drawer-control-label">Muted</span></label>
        <label class="voice-picker" for="voice-select"><span class="voice-icon" aria-hidden="true">◖</span><span class="drawer-control-label">Voice</span><select id="voice-select" aria-label="Voice"><option>Aoede</option><option>Kore</option><option>Puck</option><option>Charon</option><option>Fenrir</option></select></label>
        <label class="top-toggle" for="notifications"><input id="notifications" type="checkbox" switch aria-label="Notifications"><span id="notifications-state" class="drawer-control-label">Notify off</span></label>
      </div>
      <label class="lane-picker drawer-lane-picker" for="lane-select">
        <span>Swim lane</span>
        <select id="lane-select" disabled>
          <option value="">One-off chat</option>
        </select>
      </label>
      <span class="app-version" aria-label="Mini Live version 33">v33</span>
      <button id="drawer-dismiss" class="drawer-dismiss" type="button" aria-label="Close conversation options"><span></span></button>
    </section>

    <section class="stage">
      <button id="drawer-toggle" class="call-meta" type="button" aria-label="Conversation options" aria-expanded="false" aria-controls="settings-drawer">
        <span id="top-elapsed" class="top-elapsed">0:00</span>
        <span id="top-lane" class="top-lane">One-off chat</span>
      </button>
      <button id="orb" class="orb" type="button" aria-label="Start voice call">
        <span class="orb-glow" aria-hidden="true"></span>
        <span class="orb-disc" aria-hidden="true"></span>
        <span id="task-embers" class="task-embers" aria-hidden="true"></span>
      </button>
      <div id="highlight-stack" class="highlight-stack" role="button" tabindex="0" aria-label="Start voice call" hidden></div>
      <span id="highlight-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></span>
      <div id="word-stream" class="word-stream" aria-hidden="true" hidden></div>
      <span id="stream-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></span>

      <div class="status-copy session-status">
        <h1 id="status-label" aria-live="polite" aria-atomic="true">Preparing</h1>
        <p id="status-detail">Checking the private voice relay…</p>
        <span id="elapsed" class="elapsed sr-only">0:00</span>
        <span id="current-lane" class="current-lane sr-only">One-off chat</span>
      </div>
      <div id="live-caption" class="live-caption" aria-live="polite" aria-atomic="false" hidden></div>
    </section>

    <section id="approval-sheet" class="approval-sheet" aria-labelledby="approval-title" hidden>
      <div class="sheet-handle"></div>
      <div class="approval-kicker"><span></span><span id="approval-count">Approval needed</span></div>
      <h2 id="approval-title">Mini needs your approval</h2>
      <p id="approval-question"></p>
      <div class="approval-actions">
        <button id="deny-approval" class="button button-secondary" type="button">Deny</button>
        <button id="approve-approval" class="button button-primary" type="button">Approve once</button>
      </div>
    </section>

    <div class="bottom-stack">
      <section id="start-panel" class="start-panel">
        <button id="start-call" class="button button-primary button-large" type="button" disabled>Start voice</button>
      </section>

      <nav id="call-controls" class="call-controls" aria-label="Call controls" hidden>
        <button id="mute-call" class="round-control" type="button" aria-pressed="false">
          <span class="control-icon" aria-hidden="true">◉</span><span>Mute</span>
        </button>
        <button id="captions-call" class="round-control" type="button" aria-pressed="false">
          <span class="control-icon caption-icon" aria-hidden="true">CC</span><span>Captions</span>
        </button>
        <button id="end-call" class="round-control end-control" type="button">
          <span class="control-icon" aria-hidden="true">×</span><span>End</span>
        </button>
      </nav>

    </div>

    <button id="restore-audio" class="restore-audio" type="button" hidden>Tap to restore audio</button>
    <div id="toast" class="toast" role="status" hidden></div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
